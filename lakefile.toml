name = "forseti"
version = "0.1.0"
# Temporary: Lean 4.33 changed the default of
# backward.isDefEq.respectTransparency.types to true. Under the new default,
# instances fail to synthesise, rw and simp stop matching and HedgedSpread hits
# a heartbeat timeout, in the oscillator, decay, spread and three-state
# examples, Syntax/Context and LinearEnergy. This restores the previous default
# package-wide, as asgard-lean does; remove it in a follow-up that ports those
# proofs. It is passed as a raw -D argument because leanOptions treats the
# dotted name as a single quoted identifier.
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency.types=false"]
defaultTargets = ["Gimle.Forseti", "Gimle.Forseti.Examples", "Gimle.Forseti.Tests", "Checker"]

[[require]]
name = "asgard"
git = "https://github.com/arnovich/asgard-lean.git"
rev = "2b3ec26c2a463bccde31b8d9a369f5f2d5db72ef"

[[lean_lib]]
name = "Gimle.Forseti"
# globs for the same reason as Examples below: a module reached only through an
# import line leaves the build silently when that line is dropped, and `lake
# build` still exits 0. Note this does NOT widen the checker's audited foreign
# interface, which gates on a candidate's declared imports, not on what exists.
globs = ["Gimle.Forseti", "Gimle.Forseti.*"]

# globs keeps the filesystem authoritative: every module under
# Gimle/Forseti/Examples/ is built whether or not Examples.lean imports it.
# Without it, dropping one import line silently drops a proof module from the
# build and `lake build` still exits 0.
[[lean_lib]]
name = "Gimle.Forseti.Examples"
globs = ["Gimle.Forseti.Examples.*"]

[[lean_lib]]
name = "Gimle.Forseti.Tests"
globs = ["Gimle.Forseti.Tests", "Gimle.Forseti.Tests.*"]

[[lean_exe]]
name = "Checker"
root = "Executables.Checker"
