name: Lean verification

on:
  pull_request:
    paths-ignore: ["tasks/**", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["tasks/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check optional exact certificate search
        run: |
          python3 tools/search_suspension.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Install pinned elan
        shell: bash
        run: |
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib build cache
        run: lake exe cache get
      - name: Check libraries, examples and regression proofs
        run: lake build
      - name: Check compiled artifacts contain no checkout paths
        run: python3 tools/check_build_paths.py
      - name: Build optional equation demo
        run: lake build equation_demo
