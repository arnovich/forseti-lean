name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned elan
        shell: bash
        run: |
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib build cache
        run: lake exe cache get
      - name: Check libraries, examples and regression proofs
        run: lake build
      # Replay authenticates compiled bytes, so an absolute checkout path (for
      # example in a linter log) would make otherwise identical builds differ.
      - name: Check compiled artifacts contain no checkout paths
        shell: bash
        run: |
          lib=.lake/build/lib/lean
          test -n "$(find "$lib" -name '*.olean' -print -quit)"
          if grep -rlF "$PWD" "$lib" --include='*.olean' --include='*.olean.server' \
              --include='*.olean.private' --include='*.ir'; then
            echo "checkout path embedded in the files above" >&2
            exit 1
          fi
